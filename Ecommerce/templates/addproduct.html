{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block content %}
<div class="container w-50 p-5 mt-5 mb-4 border border-1 shadow bg-secondary">
    <h1 class="text-center fw-bold fs-2 text-light">Add Product</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{form | crispy}}
        <div class="d-flex justify-content-center">
            <input type="submit">
        </div>
    </form>
</div>
{% endblock %}
