{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block content %}
<div class="container w-50 p-5 mt-5 mb-4 border border-1 shadow bg-secondary">
    <h1 class="text-center fw-bold fs-2 text-light">Login Here!</h1>
    <form method="post">
        {% csrf_token %}
        {{form | crispy}}
        <div class="d-flex justify-content-center">
            <input type="submit">
        </div>
        {% if messages %}
        {% for m in messages %}
        <b style="color:white;">{{m}}</b>
        {% endfor %}
        {% endif %}
    </form>
</div>
{% endblock %}
